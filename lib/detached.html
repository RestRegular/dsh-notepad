<!doctype html>
<html lang="zh-CN" data-np-style="glass" data-np-theme="host">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Notepad</title>
  <link rel="stylesheet" href="/detached.css?token=__NP_TOKEN__">
</head>
<body data-token="__NP_TOKEN__" data-root="__NP_ROOT__">
  <div id="app" class="np-app" data-ready="false">
    <header class="np-head">
      <span class="np-dot" data-state="loading" id="status-dot"></span>
      <div class="np-title-wrap">
        <span class="np-title" id="app-title">记事本</span>
        <span class="np-workspace" id="workspace-title"></span>
      </div>
      <span class="np-spacer"></span>
      <button type="button" class="np-icon-btn" id="save-button" title="保存" aria-label="保存" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 2.2h7.1l2.1 2.1v9.5H3.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5.4 2.2v3.2h4.4V2.2M5.4 13.8V9.4h5.2v4.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="np-icon-btn" id="archive-button" title="显示归档" aria-label="显示归档" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.2 3.2h11.6v3.1H2.2zM3.3 6.3v6.5h9.4V6.3M6.2 8.8h3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="np-icon-btn" id="add-button" title="新建分段" aria-label="新建分段">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.4v9.2M3.4 8h9.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="np-reattach" id="reattach-button" title="收回面板">
        <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.4 3.2h3.4v3.4M12.8 3.2 7.6 8.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.4 9.4v2.3c0 .7-.6 1.3-1.3 1.3H4.6c-.7 0-1.3-.6-1.3-1.3V5.2c0-.7.6-1.3 1.3-1.3h2.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span>收回面板</span>
      </button>
    </header>

    <div class="np-tools">
      <span class="np-summary" id="summary"></span>
      <span class="np-spacer"></span>
      <button type="button" class="np-link" id="copy-all-button">复制全部</button>
    </div>

    <main class="np-list" id="list" aria-live="polite">
      <div class="np-empty" id="loading">读取中…</div>
    </main>

    <footer class="np-foot">
      <span class="np-state" id="state-text">读取中…</span>
      <span class="np-spacer"></span>
      <span class="np-count" id="count-text"></span>
      <span class="np-conn" id="conn-text" title="与 DSH 的连接状态">
        <span class="np-conn-dot" id="conn-dot"></span>
        <span id="conn-label">连接中…</span>
      </span>
    </footer>
  </div>

  <div class="np-confirm" id="confirm" hidden>
    <div class="np-confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="np-confirm-title" id="confirm-title">删除这个分段？</div>
      <div class="np-confirm-body">删除后无法恢复。分段里的文字和图片引用会一起移除。</div>
      <div class="np-confirm-actions">
        <button type="button" class="np-btn" id="confirm-cancel">取消</button>
        <button type="button" class="np-btn np-danger" id="confirm-ok">删除</button>
      </div>
    </div>
  </div>

  <div class="np-preview" id="preview" hidden>
    <img id="preview-image" alt="">
    <button type="button" class="np-preview-close" id="preview-close" aria-label="关闭预览">×</button>
  </div>

  <div class="np-retired" id="retired" hidden>
    <div class="np-retired-card">
      <div class="np-retired-title">已收回面板</div>
      <div class="np-retired-body">记事本已回到 DSH 浮窗，这个独立窗口可以关闭了。</div>
    </div>
  </div>

  <div class="np-toast" id="toast" role="status" hidden></div>

  <script type="module" src="/detached.js?token=__NP_TOKEN__"></script>
</body>
</html>
